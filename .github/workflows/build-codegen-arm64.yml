name: Build and publish Studio Sajad Glean + Nimbus tools (Android ARM64)

on:
  workflow_dispatch:
    inputs:
      glean_parser_version:
        description: "Glean Parser version required by your project's Glean plugin (default is current baseline 21.0.1)"
        required: true
        default: "21.0.1"
        type: string
      nimbus_fml_ref:
        description: "Mozilla application-services branch, tag, or commit"
        required: true
        default: "main"
        type: string
      cpython_ref:
        description: "CPython stable branch or tag"
        required: true
        default: "3.13"
        type: string

permissions:
  contents: write

jobs:
  build-arm64:
    name: Build Android ARM64 binaries and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout tools repository
        uses: actions/checkout@v4

      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java for CPython Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and native build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;27.2.12479018" "platform-tools" "platforms;android-35"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zip unzip file binutils \
            libssl-dev zlib1g-dev libffi-dev libsqlite3-dev libbz2-dev \
            libreadline-dev libncurses-dev liblzma-dev libgdbm-dev \
            libgdbm-compat-dev uuid-dev

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Glean Parser, CPython and Nimbus FML for Android ARM64
        shell: bash
        env:
          GLEAN_PARSER_VERSION: ${{ inputs.glean_parser_version }}
          NIMBUS_FML_REF: ${{ inputs.nimbus_fml_ref }}
          CPYTHON_REF: ${{ inputs.cpython_ref }}
          ANDROID_API: "21"
        run: bash tools/codegen/build-android-arm64.sh

      - name: Publish codegen-v1 Release assets for in-app automatic download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: codegen-v1
          name: Studio Sajad Codegen Tools - Android ARM64
          body: |
            Android ARM64 toolchain bundle for Studio Sajad.

            Includes CPython, Glean Parser and Mozilla Nimbus FML.
            The Studio Sajad app downloads this bundle on first use, verifies SHA-256,
            installs it in app-private storage, and reuses it for later builds.

            Glean Parser: ${{ inputs.glean_parser_version }}
            Nimbus ref: ${{ inputs.nimbus_fml_ref }}
            CPython ref: ${{ inputs.cpython_ref }}
            ABI: arm64-v8a
          files: |
            .codegen-build/dist/studio-codegen-android-arm64.zip
            .codegen-build/dist/studio-codegen-android-arm64.zip.sha256
          overwrite_files: true
          make_latest: false
